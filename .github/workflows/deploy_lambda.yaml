name: Deploy Lambdas

# Solo se despliegan las etapas cuya carpeta ha cambiado en el push.
# Un cambio en common/ despliega todas. Al lanzarlo a mano (Run workflow) también se despliegan todas.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3

permissions:
  id-token: write   # necesario para OIDC
  contents: read

jobs:
  cambios:
    name: Detectar etapas cambiadas
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.filtro.outputs.matriz }}
      hay_etapas: ${{ steps.filtro.outputs.hay_etapas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historial completo para comparar con el commit anterior al push

      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          # etapa = carpeta del repo con su Dockerfile
          ETAPAS: >-
            [
              {"etapa": "webscrapper",       "repositorio": "webscrapper-miax-14",       "funcion": "pipeline-fondos-descarga"},
              {"etapa": "pdf_markdown",      "repositorio": "pdf-to-markdown-miax-14",   "funcion": "pipeline-fondos-markdown"},
              {"etapa": "structured_output", "repositorio": "structured-output-miax-14", "funcion": "pipeline-fondos-extraccion"}
            ]
        run: |
          if [ "$EVENTO" != "push" ] || ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            # Lanzado a mano, primer push de la rama o push forzado: no hay con qué comparar
            echo "Sin commit anterior con el que comparar: se despliegan todas las etapas."
            seleccion="$ETAPAS"
          else
            cambiados=$(git diff --name-only "$ANTES" "$GITHUB_SHA")
            echo "Ficheros cambiados:"
            echo "$cambiados" | sed 's/^/  /'
            if echo "$cambiados" | grep -q '^common/'; then
              echo "Cambios en common/: se despliegan todas las etapas."
              seleccion="$ETAPAS"
            else
              seleccion=$(jq -c --arg cambiados "$cambiados" \
                '[.[] | . as $e | select($cambiados | split("\n") | any(startswith($e.etapa + "/")))]' \
                <<< "$ETAPAS")
            fi
          fi
          seleccion=$(jq -c . <<< "$seleccion")
          echo "Etapas a desplegar: $(jq -r 'map(.etapa) | join(", ")' <<< "$seleccion")"
          echo "matriz=$seleccion" >> "$GITHUB_OUTPUT"
          echo "hay_etapas=$(jq 'length > 0' <<< "$seleccion")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.etapa }}
    needs: cambios
    if: needs.cambios.outputs.hay_etapas == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # si falla una etapa, las demás se despliegan igualmente
      matrix:
        include: ${{ fromJSON(needs.cambios.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::823028065899:role/miax-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.repositorio }}:${{ github.sha }}
        run: |
          # El contexto es la raíz del repo para poder copiar common/ en la imagen
          docker build --platform linux/amd64 --provenance=false \
            -f "${{ matrix.etapa }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update function
        env:
          FUNCTION_NAME: ${{ matrix.funcion }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
